# AI Code Review Workflow (Claude Code / OpenAI Codex)
#
# Triggered by adding the "claude-review" or "codex-review" label to a PR.
# Uses stored OAuth credentials on self-hosted runner (no API keys needed).
#
# Usage:
#   1. Contributor opens PR
#   2. Collaborator adds "claude-review" or "codex-review" label when ready for review
#   3. Workflow triggers, removes the label, runs the review
#   4. Want to re-review after changes? Add the label again
#
# Review instructions live only in .claude/ (commands/review-pr.md + agents/*.md);
# the Codex job converts them at runtime via scripts/ci/gen_codex_review.py.
#
# ---- Runner One-Time Setup ----
# SSH into tzrec-codereview-runner as the runner user and run:
#
#   # Install bun
#   curl -fsSL https://bun.sh/install | bash
#
#   # Install Claude Code
#   curl -fsSL https://claude.ai/install.sh | sh
#
#   # Clone claude-code-action at pinned version and install deps (for MCP inline comment server)
#   git clone --branch v1 https://github.com/anthropics/claude-code-action.git /opt/claude-code-action
#   cd /opt/claude-code-action && bun install
#
#   # Configure MCP server for inline PR comments (~/.claude/mcp.json)
#   mkdir -p ~/.claude && cat > ~/.claude/mcp.json << 'EOF'
#   {
#     "mcpServers": {
#       "github_inline_comment": {
#         "command": "bun",
#         "args": ["run", "/opt/claude-code-action/src/mcp/github-inline-comment-server.ts"]
#       }
#     }
#   }
#   EOF
#
#   # The web-search tool the reviewers are granted
#   # (mcp__dashscope-search__web_search) is NOT provisioned here: it comes from
#   # this user's own ~/.claude/mcp.json at user scope, which merges because
#   # --strict-mcp-config is deliberately not passed. Re-add it when rebuilding
#   # the runner, or the tool named in --allowedTools and in every agent roster
#   # silently resolves to nothing.
#
#   # Login (stores OAuth credentials for headless use)
#   claude /login
#
#   # Verify headless mode works without API key
#   unset ANTHROPIC_API_KEY && unset ANTHROPIC_BASE_URL
#   claude -p "Say hello"
#
# If auth fails after a long period, re-run `claude /login` on the runner.
# Do NOT use --bare flag — it disables OAuth/keychain reads.
# ---- End Setup ----
#
# ---- Codex Runner One-Time Setup ----
# Shares bun + /opt/claude-code-action from the Claude setup above.
#
#   # Install Codex CLI (keep current: subagents + mcp env_vars need a recent version)
#   npm install -g @openai/codex
#
#   # Login with ChatGPT account (device-code flow, no browser needed on runner)
#   codex login --device-auth
#   codex login status
#
#   # REQUIRED: set the review model (the job copies top-level model* keys; no other
#   # personal config loads)
#   echo 'model = "gpt-5.5"' >> ~/.codex/config.toml
#
#   # Verify headless mode
#   echo "Say hello" | codex exec - --sandbox read-only
#
# If auth goes stale, re-run `codex login --device-auth` on the runner.
# If the runner lacks direct OpenAI egress, set HTTPS_PROXY for the runner service.
#
# Trust model: the collaborator-added label gates every run (review before labeling);
# adding a label needs triage permission, so non-collaborators cannot trigger either job.
# Codex confines model commands to a no-network sandbox, with only the gh pr
# view/diff/comment allowlist (scripts/ci/codex_review.rules) running outside it.
#
# The claude job is contained differently, and --allowedTools is NOT a command allowlist
# for it: measured on claude 2.1.257, read-only commands (ls, grep, sed -n, git log) are
# auto-approved whether or not they are listed, while writes and redirections are refused
# and file access is confined to the working directories. So --add-dir is the boundary
# that matters, and it is scoped to the conda root the reviewers read dependency sources
# from (see .pr-review/env), never the whole runner.
#
# The claude job is also granted WebFetch and a web-search MCP tool, for the dispatcher and
# all five reviewers, so it can check an API or an advisory against upstream. That is a
# deliberate trade: unlike a PR comment, a fetch is silent, so exfil from this job is no
# longer visible or auditable, and the collaborator label gate is the control. The codex
# job has no web access -- its per-run CODEX_HOME drops any [tools] block -- so the two
# jobs deliberately differ in capability.
# ---- End Codex Setup ----

name: Code Review

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to review in the isolated DSW pilot
        type: number
        required: true
      ci_digest:
        description: H20 CI image digest (sha256:...)
        type: string
        required: true

# Group by label so a codex run does not cancel an in-flight claude run
concurrency:
  group: codereview-${{ github.event.label.name || 'dsw-pilot' }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review-dsw-pilot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [tzrec-ci-dsw, tzrec-ci-review-pilot-pr755]
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted review files
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: trusted-claude
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          repository: alibaba/TorchEasyRec
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false
          path: pr-code
      - name: Prepare review checkout
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          bash trusted-claude/scripts/ci/use_trusted_agent_files.sh trusted-claude pr-code
          cd pr-code
          rm -rf -- .pr-review
          mkdir .pr-review
          curl --fail --silent --show-error --max-time 30 \
            --header 'Accept: application/vnd.github.v3.diff' \
            "https://api.github.com/repos/alibaba/TorchEasyRec/pulls/$PR_NUMBER" \
            --output .pr-review/diff
          python3 ../trusted-claude/scripts/ci/split_pr_diff.py --diff .pr-review/diff --out-dir .pr-review
      - name: Prepare DSW review container
        env:
          CI_DIGEST: ${{ inputs.ci_digest }}
        run: |
          set -euo pipefail
          [[ "$CI_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          container="review-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          runtime="$(readlink -e /opt/tzrec-ci/review/current)"
          docker run -d --pull=missing --network host --name "$container" \
            --label "tzrec-ci.node=${TZREC_CI_NODE:?}" --label "tzrec-ci.role=review-ci" \
            --cpus=2 --memory=8g --shm-size=1g --workdir /checkout \
            -v "$GITHUB_WORKSPACE/pr-code:/checkout" \
            -v "$GITHUB_WORKSPACE/trusted-claude/scripts/ci:/review/scripts:ro" \
            -v "$runtime:/review/runtime:ro" \
            "mybigpai-public-registry.cn-beijing.cr.aliyuncs.com/easyrec/tzrec-devel@$CI_DIGEST" \
            sleep infinity
          docker exec "$container" bash -ec '
            pip install -r requirements-gpu.txt
            pip install -r requirements/extra.txt
            python /review/scripts/write_cr_env.py --conda "$(command -v conda)" --out .pr-review/env
          '
      - name: Run isolated Claude review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          container="review-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker exec -i -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY -e PR_NUMBER "$container" python -I -c '
          import json
          import os
          import subprocess
          import sys
          import sysconfig
          import tempfile

          settings = json.load(sys.stdin)["env"]
          env = os.environ.copy()
          env.update({key: settings[key] for key in (
              "ANTHROPIC_MODEL", "ANTHROPIC_DEFAULT_FABLE_MODEL",
              "ANTHROPIC_DEFAULT_HAIKU_MODEL", "ANTHROPIC_DEFAULT_SONNET_MODEL",
              "ANTHROPIC_DEFAULT_OPUS_MODEL", "CLAUDE_CODE_MAX_CONTEXT_TOKENS",
              "CLAUDE_CODE_MAX_OUTPUT_TOKENS", "CLAUDE_CODE_SUBAGENT_MODEL",
          ) if key in settings})
          env["ANTHROPIC_AUTH_TOKEN"] = settings["ANTHROPIC_AUTH_TOKEN"]
          env["ANTHROPIC_BASE_URL"] = settings["ANTHROPIC_BASE_URL"]
          env["REPO_OWNER"], env["REPO_NAME"] = env["GITHUB_REPOSITORY"].split("/", 1)
          env.update(HTTP_PROXY="http://127.0.0.1:8119", HTTPS_PROXY="http://127.0.0.1:8119",
                     NO_PROXY="localhost,127.0.0.1", DISABLE_AUTOUPDATER="1")
          runtime = "/review/runtime"
          cli = runtime + "/claude"
          mcp = json.dumps({"mcpServers": {"github_inline_comment": {
              "command": runtime + "/bun",
              "args": [runtime + "/github-inline-comment-server.js"],
          }}})
          subprocess.run([cli, "--version"], check=True)
          prompt = ("Review the PR from .pr-review/diff and report findings in the response. "
                    "Use .pr-review/env to look up installed dependency sources. Do not post comments.")
          if env["PR_NUMBER"] == "755":
              prompt += (" Read the installed pyfg __init__.py and report its version "
                         "and one exact source line.")
          with tempfile.TemporaryDirectory(prefix="tzrec-claude-") as config:
              env["CLAUDE_CONFIG_DIR"] = config
              result = subprocess.run([
                  cli, "--restricted", "-p", "--no-session-persistence",
                  "--output-format", "stream-json", "--verbose",
                  "--permission-mode", "manual", "--strict-mcp-config",
                  "--mcp-config", mcp, "--tools", "Read", "--allowedTools", "Read",
                  "--add-dir", sysconfig.get_path("purelib"),
                  "--settings", json.dumps({"disableRemoteControl": True}), "--", prompt,
              ], env=env, capture_output=True, text=True)
          output = result.stdout + result.stderr
          for key in ("ANTHROPIC_AUTH_TOKEN", "GITHUB_TOKEN"):
              if env.get(key):
                  output = output.replace(env[key], "[redacted]")
          print(output, end="")
          result.check_returncode()
          ' < "${TZREC_CLAUDE_SETTINGS_FILE:?Fleet must set the runner-local settings path}"
      - name: Clean DSW review container
        if: always()
        run: docker rm -f "review-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true

  review:
    if: github.event.label.name == 'claude-review'
    runs-on: tzrec-codereview-runner
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Remove label to allow re-triggering later
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --remove-label claude-review

      # Checkout trusted agent files; cone mode also includes root-level files.
      # github.sha = the workflow's own commit; the PR's base.sha is frozen and can lag
      - name: Checkout trusted agent files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .claude
            scripts/ci
          path: trusted-claude

      # Checkout PR code for review. Fork checkout is intentional here: trusted
      # agent files come from github.sha above and the model runs sandboxed.
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          path: pr-code
          allow-unsafe-pr-checkout: true

      - name: Use trusted agent files
        run: bash trusted-claude/scripts/ci/use_trusted_agent_files.sh trusted-claude pr-code

      # The reviewers read the change from files because nothing else can hand
      # it to them: the subagents have Read but no shell, fetch-depth: 1 leaves
      # no merge base for git diff, and --permission-mode manual lets the model
      # neither redirect nor Write a file for itself. Split per file because
      # Read caps what it returns, so one combined diff reaches a reviewer
      # truncated at its tail once a PR is large.
      - name: Save PR diff for the reviewers
        working-directory: pr-code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # rm before mkdir: a PR can commit .pr-review as a symlink, and
          # writing through one would escape the checkout
          rm -rf .pr-review && mkdir .pr-review
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} > .pr-review/diff
          python3 "${GITHUB_WORKSPACE}/trusted-claude/scripts/ci/split_pr_diff.py" \
            --diff .pr-review/diff --out-dir .pr-review
          EXCLUDE="$(git rev-parse --git-path info/exclude)"
          mkdir -p "$(dirname "$EXCLUDE")"
          echo '.pr-review/' >> "$EXCLUDE"

          # ~/.bashrc is never sourced in a step, so conda's PATH block never runs --
          # same trap as the bun path below. The manifest tells the reviewers where
          # installed dependencies are; its root is all they are given to read.
          CONDA="$(which conda 2>/dev/null || echo "$HOME/conda/bin/conda")"
          ENV_ROOT="$(python3 \
            "${GITHUB_WORKSPACE}/trusted-claude/scripts/ci/write_cr_env.py" \
            --conda "$CONDA" --out .pr-review/env)"
          echo "REVIEW_ENV_ROOT=$ENV_ROOT" >> "$GITHUB_ENV"

      - name: RunCodeReview
        working-directory: pr-code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Post inline comments as they are created. Left unset, the MCP server
          # buffers them into /tmp for a post-step that only claude-code-action
          # runs; these jobs drive the CLI directly, so nothing would post them.
          CLASSIFY_INLINE_COMMENTS: "false"
          # No ANTHROPIC_API_KEY — uses stored OAuth from `claude /login` on the runner
          # MCP server inherits env vars (GITHUB_TOKEN, REPO_OWNER, REPO_NAME,
          # PR_NUMBER, CLASSIFY_INLINE_COMMENTS)
        run: |
          set -euo pipefail

          # Resolve full bun path (bun installed to ~/.bun/bin/ — not in Claude's subprocess PATH)
          BUN_PATH="$(which bun 2>/dev/null || echo "$HOME/.bun/bin/bun")"
          echo "bun path: $BUN_PATH ($("$BUN_PATH" --version))"

          MCP_CONFIG="{\"mcpServers\":{\"github_inline_comment\":{\"command\":\"${BUN_PATH}\",\"args\":[\"run\",\"/opt/claude-code-action/src/mcp/github-inline-comment-server.ts\"]}}}"

          # Read access is scoped to the checkout plus the conda root resolved above,
          # so the runner's $HOME -- which holds the stored OAuth credentials -- is not
          # readable. It falls back to the working directory, which is already
          # allowed, when the runner has no conda environment.
          claude -p \
            --output-format stream-json \
            --verbose \
            --permission-mode manual \
            --add-dir "${REVIEW_ENV_ROOT:-$PWD}" \
            --settings '{"disableRemoteControl": true}' \
            --mcp-config "$MCP_CONFIG" \
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob,Agent,WebFetch,mcp__dashscope-search__web_search" \
            -- "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${PR_NUMBER}"

  codex-review:
    if: github.event.label.name == 'codex-review'
    runs-on: tzrec-codereview-runner
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Remove label to allow re-triggering later
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --remove-label codex-review

      # Trusted .claude/ + scripts at github.sha (the workflow's own commit, never the
      # PR's frozen base.sha)
      - name: Checkout trusted agent files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .claude
            scripts/ci
          path: trusted-claude

      # Checkout PR code for review. Fork checkout is intentional here: trusted
      # agent files come from github.sha above and the model runs sandboxed.
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          path: pr-code
          allow-unsafe-pr-checkout: true

      # Same trusted-file setup as the claude job, plus generated codex agents as an overlay
      - name: Use trusted agent files
        run: |
          python3 trusted-claude/scripts/ci/gen_codex_review.py \
            --claude-dir trusted-claude/.claude \
            --out-dir "${{ runner.temp }}/codex-gen" \
            --repo ${{ github.repository }} \
            --pr-number ${{ github.event.pull_request.number }} \
            --prompt-out "${{ runner.temp }}/codex-prompt.md"
          bash trusted-claude/scripts/ci/use_trusted_agent_files.sh \
            trusted-claude pr-code "${{ runner.temp }}/codex-gen"

      # Same files, same reason: the subagent sandboxes are read-only and
      # offline, so `gh pr diff` is unreachable from inside a review.
      - name: Save PR diff for the reviewers
        working-directory: pr-code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # rm before mkdir: a PR can commit .pr-review as a symlink, and
          # writing through one would escape the checkout
          rm -rf .pr-review && mkdir .pr-review
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} > .pr-review/diff
          python3 "${GITHUB_WORKSPACE}/trusted-claude/scripts/ci/split_pr_diff.py" \
            --diff .pr-review/diff --out-dir .pr-review
          EXCLUDE="$(git rev-parse --git-path info/exclude)"
          mkdir -p "$(dirname "$EXCLUDE")"
          echo '.pr-review/' >> "$EXCLUDE"

          # Same manifest for the codex reviewers; this job has no --add-dir to scope.
          CONDA="$(which conda 2>/dev/null || echo "$HOME/conda/bin/conda")"
          python3 "${GITHUB_WORKSPACE}/trusted-claude/scripts/ci/write_cr_env.py" \
            --conda "$CONDA" --out .pr-review/env > /dev/null

      - name: RunCodexReview
        working-directory: pr-code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # No OPENAI_API_KEY — uses stored OAuth from `codex login` on the runner
        run: |
          set -euo pipefail

          # Resolve full bun path (bun installed to ~/.bun/bin/ — not in subprocess PATH)
          BUN_PATH="$(which bun 2>/dev/null || echo "$HOME/.bun/bin/bun")"
          echo "bun path: $BUN_PATH ($("$BUN_PATH" --version))"
          codex --version

          # Per-run CODEX_HOME (stored auth + trusted rules + generated config only)
          REAL_CODEX_HOME="${CODEX_HOME:-$HOME/.codex}"
          export CODEX_HOME="${RUNNER_TEMP}/codex-home"
          rm -rf "$CODEX_HOME" && mkdir -p "$CODEX_HOME/rules"
          cp "$REAL_CODEX_HOME/auth.json" "$CODEX_HOME/auth.json"
          cp "$GITHUB_WORKSPACE/trusted-claude/scripts/ci/codex_review.rules" \
            "$CODEX_HOME/rules/default.rules"

          # Copy the runner's top-level model* settings; subagent spawn needs explicit model=
          awk '/^\[/{exit} /^model[a-z_]* *=/{print}' "$REAL_CODEX_HOME/config.toml" \
            > "$CODEX_HOME/config.toml"
          grep -q '^model *=' "$CODEX_HOME/config.toml" || {
            echo "::error::set model = \"...\" in the runner's ~/.codex/config.toml"; exit 1; }

          # The MCP server gets its token here (config file, not argv or codex
          # env), and this block is its whole environment, so the inline-comment
          # buffer opt-out has to be repeated here
          cat >> "$CODEX_HOME/config.toml" << EOF

          [mcp_servers.github_inline_comment]
          command = "${BUN_PATH}"
          args = ["run", "/opt/claude-code-action/src/mcp/github-inline-comment-server.ts"]
          default_tools_approval_mode = "approve"

          [mcp_servers.github_inline_comment.env]
          GITHUB_TOKEN = "${GITHUB_TOKEN}"
          REPO_OWNER = "${REPO_OWNER}"
          REPO_NAME = "${REPO_NAME}"
          PR_NUMBER = "${PR_NUMBER}"
          CLASSIFY_INLINE_COMMENTS = "false"
          EOF
          chmod 600 "$CODEX_HOME/config.toml"

          # HOME shim hides the runner user's personal ~/.agents skills
          export HOME="${RUNNER_TEMP}/codex-home-shim"
          rm -rf "$HOME" && mkdir -p "$HOME"

          # Store gh login in the shim HOME; codex runs token-free so model commands can't read it
          echo "$GITHUB_TOKEN" | env -u GITHUB_TOKEN -u GH_TOKEN gh auth login --with-token

          # No-network sandbox; only the gh pr view/diff/comment rules allowlist escapes it
          env -u GITHUB_TOKEN -u GH_TOKEN codex exec \
            --ephemeral \
            --sandbox workspace-write \
            --output-last-message "${RUNNER_TEMP}/codex-review-last.md" \
            - < "${RUNNER_TEMP}/codex-prompt.md"

          # Persist token refreshes back to the runner's stored auth
          cmp -s "$CODEX_HOME/auth.json" "$REAL_CODEX_HOME/auth.json" || \
            cp "$CODEX_HOME/auth.json" "$REAL_CODEX_HOME/auth.json"
