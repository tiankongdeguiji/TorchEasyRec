name: Drain acceptance witness
run-name: drain-check ${{ inputs.token }}
on:
  workflow_dispatch:
    inputs:
      token:
        type: string
        required: true
      runner_label:
        type: string
        required: true
      duration:
        type: string
        default: '45'
permissions: {}
jobs:
  witness:
    runs-on: [tzci-dsw, '${{ inputs.runner_label }}']
    timeout-minutes: 5
    steps:
      - name: Finish an assigned job naturally
        env:
          HOLD_SECONDS: ${{ inputs.duration }}
        run: |
          python3 - <<'PY'
          import os, time
          print('runner context', os.environ['TZCI_NODE'], os.environ['TZCI_ROLE'], flush=True)
          time.sleep(int(os.environ['HOLD_SECONDS']))
          print('finished naturally', flush=True)
          PY
