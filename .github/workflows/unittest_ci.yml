name: Diskless recovery h20
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    timeout-minutes: 35
    runs-on: [tzrec-ci-dsw, tzrec-diskless-pilot-h20]
    steps:
      - name: Run tensor smoke on the DSW
        run: |
          set -euo pipefail
          printf 'runner=%s lane=%s
          ' "$RUNNER_NAME" "h20" | tee smoke.log
          CUDA_HOME=/usr/local/cuda-13 LD_LIBRARY_PATH=/usr/local/cuda-13/compat /opt/conda/bin/python -c '
          import sys
          import torch

          count = int(sys.argv[1])
          if count:
              assert torch.cuda.device_count() == count, torch.cuda.device_count()
          for device in ([f"cuda:{i}" for i in range(count)] if count else ["cpu"]):
              x = torch.ones(8, device=device)
              assert (x @ x).item() == 8
          print(f"Tensor smoke passed on {count} accelerators" if count else "CPU tensor smoke passed")
          ' 8 | tee -a smoke.log
      - name: Upload smoke result
        uses: actions/upload-artifact@v4
        with:
          name: h20
          path: smoke.log
          if-no-files-found: error
          retention-days: 3
