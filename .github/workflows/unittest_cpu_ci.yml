name: Root CPU drain witness
run-name: root-cpu-${{ inputs.ticket }}
on:
  workflow_dispatch:
    inputs:
      ticket:
        required: true
        type: string
permissions: {}
jobs:
  ci-test:
    runs-on: [tzci-dsw, root-check-cpu-20261114]
    steps:
      - name: Finish the assigned CPU job naturally
        run: |
          test "$(id -u)" = 0
          test "$TZCI_ROLE" = cpu
          sleep 55
