name: Diskless recovery ppu
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    timeout-minutes: 35
    runs-on: [tzrec-ci-dsw, tzrec-diskless-pilot-ppu]
    steps:
      - name: Run tensor smoke in CI image
        run: |
          set -euo pipefail
          printf 'runner=%s lane=%s
          ' "$RUNNER_NAME" "ppu" | tee smoke.log
          docker run --rm --pull=always --label "tzrec-ci.node=$TZREC_CI_NODE" --label "tzrec-ci.role=$TZREC_CI_ROLE" --device=/dev/alixpu_ppu0 --device=/dev/alixpu_ppu1 --device=/dev/alixpu_ppu2 --device=/dev/alixpu_ppu3 --device=/dev/alixpu_ppu4 --device=/dev/alixpu_ppu5 --device=/dev/alixpu_ppu6 --device=/dev/alixpu_ppu7 --device=/dev/alixpu_ppu8 --device=/dev/alixpu_ppu9 --device=/dev/alixpu_ppu10 --device=/dev/alixpu_ppu11 --device=/dev/alixpu_ppu12 --device=/dev/alixpu_ppu13 --device=/dev/alixpu_ppu14 --device=/dev/alixpu_ppu15 --device=/dev/alixpu --device=/dev/alixpu_ctl mybigpai-public-registry.cn-beijing.cr.aliyuncs.com/easyrec/tzrec-devel:1.5-ppu python -c '
          import sys
          import torch

          count = int(sys.argv[1])
          if count:
              assert torch.cuda.device_count() == count, torch.cuda.device_count()
          for device in ([f"cuda:{i}" for i in range(count)] if count else ["cpu"]):
              x = torch.ones(8, device=device)
              assert (x @ x).item() == 8
          print(f"Tensor smoke passed on {count} accelerators" if count else "CPU tensor smoke passed")
          ' 16 | tee -a smoke.log
      - name: Upload smoke result
        uses: actions/upload-artifact@v4
        with:
          name: ppu
          path: smoke.log
          if-no-files-found: error
          retention-days: 3
